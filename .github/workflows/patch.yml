name: Packaging
on:
  push:
    branches:
      - 6.4.1-patches

env:
  base_version: 6.4.1

jobs:
  build:
    name: Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Download Civi
        env:
          civi_package: civicrm-${{ env.base_version }}-drupal.tar.gz
        run: |
          cd ..
          pwd
          mkdir to-be-patched
          wget https://storage.googleapis.com/civicrm/civicrm-stable/${base_version}/${civi_package}
          tar xzf ./${civi_package} -C to-be-patched

      - name: Apply PR https://github.com/civicrm/civicrm-drupal/pull/692
        run: |
          cd ..
          rm -f to-be-patched/civicrm/drupal/modules/civicrmtheme/civicrmtheme.module
          wget https://raw.githubusercontent.com/compucorp/civicrm-drupal/66a349a52054c1c1ba515fa135c68c56ed7a5dd7/modules/civicrmtheme/civicrmtheme.module
          mv civicrmtheme.module to-be-patched/civicrm/drupal/modules/civicrmtheme/civicrmtheme.module

      - name: Checkout the fork
        uses: actions/checkout@v2
        with:
          ref: ${{ env.base_version }}

      - name: Create patched package
        uses: compucorp/create-patch-from-fork@1.0.0
        id: "patch"
        with:
          base_version: ${{ env.base_version }}
          project_dir: '../to-be-patched/civicrm'
          project_name: 'civicrm'
          project_type: 'civicrm-core'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, json, mbstring, mysqli, simplexml, xml, xmlreader, xmlwriter, zip, zlib
          tools: composer:2.8.12

      - name: Install locked library versions
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          cd ../to-be-patched/civicrm
          composer install --no-dev --no-interaction --optimize-autoloader --no-scripts
          cd ..
          tar czf "${{ steps.patch.outputs.package_path }}" civicrm

      - name: Verify vendor matches the lock
        run: |
          cd ../to-be-patched/civicrm
          composer validate --no-check-all --no-check-publish
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true)["packages"];
            $inst = json_decode(file_get_contents("vendor/composer/installed.json"), true)["packages"];
            $l = []; foreach ($lock as $p) { $l[$p["name"]] = $p["version"]; }
            $v = []; foreach ($inst as $p) { $v[$p["name"]] = $p["version"]; }
            $bad = [];
            foreach ($l as $n => $ver) {
              if (!isset($v[$n])) { $bad[] = "$n: locked $ver, not installed"; }
              elseif ($v[$n] !== $ver) { $bad[] = "$n: locked $ver, vendor has {$v[$n]}"; }
            }
            foreach ($v as $n => $ver) { if (!isset($l[$n])) { $bad[] = "$n: vendor has $ver, not in lock"; } }
            if ($bad) { fwrite(STDERR, "vendor/ does not match composer.lock:" . PHP_EOL . "  " . implode(PHP_EOL . "  ", $bad) . PHP_EOL); exit(1); }
            printf("vendor/ matches composer.lock (%d packages)" . PHP_EOL, count($l));
          '

      - name: Create a new release
        id: create_release
        uses: compucorp/create-release@target_commitish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ steps.patch.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          release_name: "${{ steps.patch.outputs.version }}"
          body: "${{ steps.patch.outputs.version }}"

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "${{ steps.patch.outputs.package_path }}"
          asset_name: "${{ steps.patch.outputs.package }}"
          asset_content_type: application/gzip
